AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bridge resources for an existing S3 + CloudFront site. Creates Lambda,
  KeyValueStore, and a function in CloudFront Functions without modifying
  the existing bucket notification configuration or Distribution.

Parameters:
  ProjectName:
    Type: String
    Default: htaccess-bridge
  ContentBucketName:
    Type: String
    Description: "Name of your EXISTING site content bucket (not created by this template)."
Resources:
  HtaccessConfigStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: !Sub "${ProjectName}-kvs"
      Comment: "Normalized .htaccess config published by htaccess_bridge Lambda"

  HtaccessBridgeManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-lambda-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ContentBucketAccess
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${ContentBucketName}"
          - Sid: S3ContentObjectAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "arn:aws:s3:::${ContentBucketName}/*"
          - Sid: CloudFrontKvsAccess
            Effect: Allow
            Action:
              - cloudfront-keyvaluestore:DescribeKeyValueStore
              - cloudfront-keyvaluestore:UpdateKeys
            Resource: !GetAtt HtaccessConfigStore.Arn
          - Sid: CloudWatchLogsAccess
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-fn*"

  HtaccessBridgeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref HtaccessBridgeManagedPolicy

  HtaccessBridgeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-fn"
      Runtime: python3.13
      Handler: htaccess_bridge.handler
      Role: !GetAtt HtaccessBridgeExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        # Placeholder only. The real code (with botocore[crt]) typically exceeds
        # what an inline ZipFile can hold, and is deployed separately with:
        #   aws lambda update-function-code --function-name <FunctionName output> \
        #     --zip-file fileb://htaccess_bridge.zip
        # This avoids needing a dedicated S3 artifact bucket. See
        # docs/integration-guide.md step 2.
        ZipFile: |
          def handler(event, context):
              raise RuntimeError(
                  "Placeholder code. Deploy the real function with: "
                  "aws lambda update-function-code --zip-file fileb://htaccess_bridge.zip"
              )
      Environment:
        Variables:
          KVS_ARN: !GetAtt HtaccessConfigStore.Arn
          HISTORY_PREFIX: _control-history

  HtaccessBridgeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-fn"
      RetentionInDays: 7

  ContentBucketLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt HtaccessBridgeFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${ContentBucketName}"

  HtaccessViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-viewer-request"
      FunctionConfig:
        Comment: "htaccess bridge viewer-request function"
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt HtaccessConfigStore.Arn
      AutoPublish: true
      # BEGIN GENERATED CLOUDFRONT FUNCTION CODE
      FunctionCode: |
        import t from"cloudfront";import r from"crypto";var e=t.kvs(),n="htaccess-redirects-meta",a="htaccess-redirects-",s="htaccess-auth-scopes-meta",i="htaccess-auth-scopes-",u="htaccess-directory-index-meta",c="htaccess-directory-index-",o="htaccess-maintenance";async function handler(t){var r=t.request,e=r.uri||"/";if(d(e))return{statusCode:403,statusDescription:"Forbidden"};var n=await l(),a=v(e,n);if(a&&!g(t,r,a))return"ip"===a.mode?{statusCode:403,statusDescription:"Forbidden",headers:{"cache-control":{value:"no-store"}}}:w(a);var s=x(e,n.redirects||[]);return s?{statusCode:s.status,statusDescription:301===s.status?"Moved Permanently":"Found",headers:{location:{value:s.location}}}:(r.uri=I(e,n.directoryIndexScopes||[]),r)}async function l(){var t=await Promise.all([f(n,a),f(s,i),f(u,c),h(o,{enabled:!1,realm:"Maintenance"})]);return{schemaVersion:1,redirects:t[0],authScopes:t[1],directoryIndexScopes:t[2],maintenance:t[3]}}async function f(t,r){var e,n=(await h(t,{chunkCount:0})).chunkCount||0;if(0===n)return[];for(var a=[],s=0;s<n;s++)a.push(h(r+s,[]));for(var i=await Promise.all(a),u=[],c=0;c<i.length;c++)u=u.concat(i[c]);return u}async function h(t,r){try{var n=await e.get(t);return JSON.parse(n)}catch(t){return r}}function d(t){return"/.htaccess"===t||"/.htpasswd"===t||0===t.indexOf("/_control-history/")||P(t,"/.htaccess")||P(t,"/.htpasswd")}function v(t,r){for(var e=r.authScopes||[],n=0;n<e.length;n++)if(e[n].enabled&&O(t,e[n].pathPrefix))return e[n];return r.maintenance&&r.maintenance.enabled?r.maintenance:null}function g(t,e,n){if("ip"===n.mode)return p(t,n.allowIps||[]);if(p(t,n.allowIps||[]))return!0;var a=e.headers||{},s=a.authorization&&a.authorization.value,i;if(!s||"basic "!==s.substring(0,6).toLowerCase())return!1;try{i=Buffer.from(s.substring(6),"base64").toString("utf8")}catch(t){return!1}var u=i.indexOf(":");if(u<1)return!1;for(var c=i.substring(0,u),o=i.substring(u+1),l=r.createHash("sha1").update(o).digest("base64"),f=n.credentials||[],h=0;h